version: '3.8'

networks:
  auramarket-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: auramarket-postgres
    restart: always
    environment:
      POSTGRES_USER: auramarket_user
      POSTGRES_PASSWORD: auramarket_secure_password_2026
      POSTGRES_DB: auramarket_tenant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auramarket_user -d auramarket_tenant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auramarket-network

  redis:
    image: redis:7.2-alpine
    container_name: auramarket-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auramarket-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: auramarket-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - auramarket-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: auramarket-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - auramarket-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    container_name: auramarket-kafka-ui
    restart: always
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: auramarket-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - auramarket-network
