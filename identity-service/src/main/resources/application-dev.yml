spring:
  datasource:
    url: ${IDENTITY_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auramarket_identity}}
    username: ${IDENTITY_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:auramarket_user}}
    password: ${IDENTITY_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:auramarket_secure_password_2026}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
