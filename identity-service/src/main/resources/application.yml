server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: identity-service
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

identity:
  jwt:
    issuer: auramarket-identity
    audience: auramarket-api
    # Override with JWT_SECRET. This fallback is intentionally not suitable for production.
    secret: ${JWT_SECRET:local-dev-only-change-this-secret-before-running}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
