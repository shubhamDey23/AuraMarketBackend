server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: identity-service-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: tenant-service
          uri: ${TENANT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/storefront/**, /api/v1/tenants/**, /api/v1/admin/tenants/**

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/catalog/**, /api/v1/products/**

        - id: seller-service
          uri: ${SELLER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/sellers/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/inventory/**

        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/cart/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/orders/**, /api/v1/seller/orders/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/payments/**

        - id: consultation-service
          uri: ${CONSULTATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/consultations/**, /api/v1/doctors/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/notifications/**

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/admin/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
